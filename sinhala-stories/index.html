            line-height: 2;

            margin-bottom: 1.5em;
            text-align: justify;
        }

            border: none;
            border-top: 1px solid #49454F;
            margin: 2em auto;
            width: 60%;

            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
